name: Deploy Quartz site

on:
  push:
    branches:
      - web-publish
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Install Quartz
        run: |
          cd quartz
          npm install
      - name: Prepare content for Quartz
        run: |
          rm -rf quartz/content
          mkdir -p quartz/content

          # copy everything except quartz itself
          rsync -av \
            --exclude='quartz' \
            --exclude='.git' \
            --exclude='pre-rendered' \
            ./ quartz/content/

      - name: Build site
        run: |
          cd quartz
          npx quartz build

      # --- AUTOMATED PRE-RENDERED INJECTION LOOP ---
      # This loops through every .html file in pre-rendered/, creates a folder 
      # matching its filename, and names the file index.html inside it.

      - name: Inject Pre-Rendered Apps Dynamically
        run: |
          if [ -d "pre-rendered" ] && [ "$(ls -A pre-rendered/*.html 2>/dev/null)" ]; then
            echo "Found pre-rendered pages. Processing..."
            for file in pre-rendered/*.html; do
              # Extract the filename without the path or extension (e.g., 'spell-hand')
              slug=$(basename "$file" .html)
              
              echo "Creating clean routing directory for: /$slug"
              mkdir -p "quartz/public/$slug"
              
              # Copy the file as index.html so it serves cleanly at that route
              cp "$file" "quartz/public/$slug/index.html"
            done
          else
            echo "No pre-rendered .html files found to inject."
          fi

      - name: Deploy to gh-pages
        run: |
          cd quartz/public
          git init
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add .
          git commit -m "Deploy site"
          git branch -M gh-pages
          git remote add origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}
          git push -f origin gh-pages
